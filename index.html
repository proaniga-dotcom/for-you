<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Bouquet For Rutchie</title>
<style>
  @import url('https://googleapis.com');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #2a1829 0%, #140b15 100%);
    color: #fff5f8;
    font-family: 'Quicksand', sans-serif;
    overflow: hidden;
    position: relative;
  }

  .particle {
    position: absolute;
    background: radial-gradient(circle, rgba(255, 192, 217, 0.8) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
    20% { opacity: 0.7; }
    80% { opacity: 0.7; }
    100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
  }

  .header {
    text-align: center;
    z-index: 10;
    margin-bottom: -10px;
    animation: fadeIn 1.5s ease-out;
  }

  .header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 700;
    letter-spacing: 1px;
    color: #ffd1e0;
    text-shadow: 0 0 20px rgba(255, 130, 175, 0.4);
  }

  .header p {
    font-size: 0.95rem;
    color: #d8a7b8;
    margin-top: 4px;
  }

  .stage {
    position: relative;
    width: min(92vw, 480px);
    height: min(68vh, 520px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }

  svg#bouquet {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.55));
  }

  .stem {
    stroke-dasharray: 400;
    stroke-dashoffset: 400;
    animation: drawStem 1.4s ease-out forwards;
  }

  @keyframes drawStem {
    to { stroke-dashoffset: 0; }
  }

  .flower-head {
    transform-origin: center;
    transform-box: fill-box;
    opacity: 0;
    transform: scale(0);
    animation: bloom 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    cursor: pointer;
    transition: filter 0.3s ease;
  }

  .flower-head:hover {
    filter: brightness(1.15) drop-shadow(0 0 12px rgba(255, 180, 210, 0.6));
  }

  @keyframes bloom {
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  .sway-group {
    transform-origin: 250px 460px;
    animation: gentleSway 5s ease-in-out infinite alternate;
  }

  @keyframes gentleSway {
    0% { transform: rotate(-1.5deg); }
    100% { transform: rotate(1.5deg); }
  }

  .controls {
    z-index: 10;
    display: flex;
    gap: 12px;
    margin-top: 8px;
  }

  .btn {
    background: linear-gradient(135deg, #ff7597, #ff4d79);
    border: none;
    padding: 12px 26px;
    border-radius: 50px;
    color: white;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255, 77, 121, 0.35);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px rgba(255, 77, 121, 0.5);
  }

  .btn-secondary {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 209, 224, 0.3);
    box-shadow: none;
  }

  .note-overlay {
    position: fixed;
    inset: 0;
    background: rgba(12, 6, 14, 0.75);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    padding: 20px;
  }

  .note-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .note-card {
    background: linear-gradient(145deg, #fff9fb, #ffeef4);
    color: #3a1d28;
    max-width: 420px;
    width: 100%;
    padding: 36px 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    border: 2px solid #ffc2d4;
    transform: translateY(20px) scale(0.95);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
  }

  .note-overlay.open .note-card {
    transform: translateY(0) scale(1);
  }

  .note-card h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    color: #b52b54;
    margin-bottom: 14px;
  }

  .note-card p {
    font-size: 1.05rem;
    line-height: 1.65;
    color: #542c3a;
    margin-bottom: 24px;
  }

  .note-card .signature {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.4rem;
    color: #b52b54;
    margin-bottom: 20px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <div class="header">
    <h1 id="titleText">For My Favorite Person</h1>
    <p>Tap any flower or open your card below</p>
  </div>

  <div class="stage">
    <svg id="bouquet" viewBox="0 0 500 540" xmlns="http://w3.org">
      <defs>
        <linearGradient id="wrapBack" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f7d6e0" />
          <stop offset="100%" stop-color="#e2a8bc" />
        </linearGradient>
        <linearGradient id="wrapFrontLeft" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffe5ec" />
          <stop offset="100%" stop-color="#f2b5c8" />
        </linearGradient>
        <linearGradient id="wrapFrontRight" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffd6e2" />
          <stop offset="100%" stop-color="#e59eb5" />
        </linearGradient>
        <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#c9184a" />
          <stop offset="50%" stop-color="#ff4d6d" />
          <stop offset="100%" stop-color="#a4133c" />
        </linearGradient>
      </defs>

      <g class="sway-group">
        <polygon points="250,480 110,210 250,150 390,210" fill="url(#wrapBack)" />
        <polygon points="250,480 135,190 250,175 365,190" fill="#fff0f5" opacity="0.6" />

        <g id="stemsLayer"></g>
        <g id="flowersLayer"></g>

        <polygon points="250,485 125,265 255,345" fill="url(#wrapFrontLeft)" />
        <polygon points="250,485 375,265 245,345" fill="url(#wrapFrontRight)" />

        <path d="M 218 372 Q 250 385 282 372 L 278 386 Q 250 398 222 386 Z" fill="url(#ribbonGrad)" />
        <path d="M 248 378 C 210 350, 195 385, 245 383 Z" fill="#ff4d6d" />
        <path d="M 252 378 C 290 350, 305 385, 255 383 Z" fill="#ff4d6d" />
        <path d="M 245 383 Q 225 425 210 455 L 224 452 Q 236 422 250 385 Z" fill="#c9184a" />
        <path d="M 255 383 Q 275 425 290 455 L 276 452 Q 264 422 250 385 Z" fill="#c9184a" />
        <circle cx="250" cy="380" r="8" fill="#a4133c" />
      </g>
    </svg>
  </div>

  <div class="controls">
    <button class="btn" onclick="toggleNote(true)">Read Your Note 💌</button>
    <button class="btn btn-secondary" onclick="rebloom()">Bloom Again ✨</button>
  </div>

  <div class="note-overlay" id="noteOverlay" onclick="if(event.target === this) toggleNote(false)">
    <div class="note-card">
      <h2 id="cardHeading">Just Because...</h2>
      <p id="cardMessage">
        I wanted to give you flowers that never fade. Thank you for making every single day brighter just by being in it.
      </p>
      <div class="signature" id="cardSignature">— Yours Always</div>
      <button class="btn" onclick="toggleNote(false)">Close</button>
    </div>
  </div>

<script>
  const CONFIG = {
    pageTitle: "For My Favorite Person",
    cardHeading: "Just Because...",
    cardMessage: "I wanted to give you flowers that never fade. Thank you for making every single day brighter just by being in it.",
    signature: "— Yours Always"
  };

  document.getElementById('titleText').textContent = CONFIG.pageTitle;
  document.getElementById('cardHeading').textContent = CONFIG.cardHeading;
  document.getElementById('cardMessage').textContent = CONFIG.cardMessage;
  document.getElementById('cardSignature').textContent = CONFIG.signature;

  const flowers = [
    { x: 250, y: 185, scale: 1.15, type: 'rose', colors: ['#ff4d6d', '#ff758f', '#ffb3c1'], delay: 0.4 },
    { x: 195, y: 210, scale: 1.0,  type: 'rose', colors: ['#ff8fa3', '#ffb3c1', '#ffe5ec'], delay: 0.6 },
    { x: 305, y: 210, scale: 1.0,  type: 'rose', colors: ['#c9184a', '#ff4d6d', '#ff8fa3'], delay: 0.7 },
    { x: 165, y: 260, scale: 0.92, type: 'daisy', colors: ['#fff0f5', '#ffd166'], delay: 0.8 },
    { x: 335, y: 260, scale: 0.92, type: 'daisy', colors: ['#fff0f5', '#ffd166'], delay: 0.9 },
    { x: 225, y: 255, scale: 1.08, type: 'rose', colors: ['#ff758f', '#ffccd5', '#fff0f3'], delay: 1.0 },
    { x: 280, y: 255, scale: 1.05, type: 'rose', colors: ['#ff4d6d', '#ff8fa3', '#ffd6e0'], delay: 1.1 },
    { x: 250, y: 300, scale: 0.95, type: 'daisy', colors: ['#ffe5ec', '#ffb703'], delay: 1.2 },
    { x: 195, y: 300, scale: 0.88, type: 'rose', colors: ['#e05780', '#ff8fab', '#ffc2d1'], delay: 1.3 },
    { x: 305, y: 300, scale: 0.88, type: 'rose', colors: ['#ff7096', '#ff9ebb', '#ffe5ec'], delay: 1.4 }
  ];

  const stemsLayer = document.getElementById('stemsLayer');
  const flowersLayer = document.getElementById('flowersLayer');

  function renderBouquet() {
    stemsLayer.innerHTML = '';
    flowersLayer.innerHTML = '';

    const leaves = [
      { x: 150, y: 220, rot: -40 },
      { x: 350, y: 220, rot: 40 },
      { x: 135, y: 275, rot: -55 },
      { x: 365, y: 275, rot: 55 },
      { x: 215, y: 165, rot: -15 },
      { x: 285, y: 165, rot: 15 }
    ];

    leaves.forEach((leaf, i) => {
      const el = document.createElementNS('http://w3.org', 'ellipse');
