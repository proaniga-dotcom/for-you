<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Bouquet for You</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 16px;
    background: radial-gradient(circle at 50% 40%, #2e1827, #150b13 70%);
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #f3cfdb; text-align: center;
  }
  h1 {
    margin: 0; font: bold clamp(1.8rem, 6vw, 3.2rem) Georgia, "Times New Roman", serif;
    letter-spacing: 2px; color: #ffd1dc;
    text-shadow: 0 0 18px rgba(255,120,160,.55);
  }
  .name { margin: 0; font-size: 1rem; opacity: .85; }
  svg {
    height: min(50vh, 420px); width: auto; margin: 10px 0;
    filter: drop-shadow(0 12px 18px rgba(0,0,0,.6));
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-8px); } }

  .rose { transform: scale(0); transform-origin: 0 0; }
  .bloom .rose { animation: pop .9s cubic-bezier(.3,1.5,.5,1) var(--d) forwards; }
  @keyframes pop { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(0); } }
  .stem { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .bloom .stem { animation: grow .8s ease forwards; }
  @keyframes grow { to { stroke-dashoffset: 0; } }
  .leaf { opacity: 0; }
  .bloom .leaf { animation: fade .6s ease .5s forwards; }
  @keyframes fade { to { opacity: 1; } }

  .buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button {
    font: 600 1rem inherit; font-family: inherit; cursor: pointer;
    padding: 14px 28px; border-radius: 999px; color: #fff;
    transition: transform .15s;
  }
  button:hover { transform: translateY(-2px); }
  .primary { border: 0; background: linear-gradient(135deg, #ff6f91, #ff4d7d); box-shadow: 0 0 22px rgba(255,90,130,.5); }
  .secondary { background: #2b2029; border: 1px solid #5a4658; }

  .overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(10,4,8,.75); padding: 20px;
  }
  .overlay.show { display: flex; }
  .card {
    max-width: 440px; width: 100%; padding: 28px; border-radius: 18px;
    background: #fff5f7; color: #6b2540; text-align: left;
    font-family: Georgia, serif; line-height: 1.6;
    box-shadow: 0 0 40px rgba(255,90,130,.35);
  }
  .card h2 { margin: 0 0 10px; }
  .card p { margin: 0 0 12px; }
  .card button { margin-top: 6px; padding: 10px 22px; background: #ff4d7d; border: 0; }
</style>
</head>
<body>
  <h1>For My Favorite Person</h1>
  <p class="name">Rutchie Ann D. Sumaya</p>

  <svg id="bouquet" viewBox="0 0 320 430" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <g id="rose">
        <ellipse cx="0" cy="20" rx="14" ry="6" fill="#3f8f50"/>
        <g fill="currentColor" stroke="rgba(0,0,0,.28)" stroke-width="1.5">
          <circle r="22"/><circle r="16"/><circle r="10"/>
        </g>
        <path d="M-4 0 Q-4 -5 1 -5 Q6 -5 6 0 Q6 6 0 6" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M-17 -6 Q-8 -20 8 -17 M17 6 Q8 20 -8 17" fill="none" stroke="rgba(0,0,0,.2)" stroke-width="1.5" stroke-linecap="round"/>
      </g>
    </defs>

    <!-- back of wrapping -->
    <polygon points="80,255 240,255 192,410 128,410" fill="#f4d3df"/>

    <!-- stems -->
    <g stroke="#3f8f50" stroke-width="4" fill="none" stroke-linecap="round">
      <path class="stem" pathLength="1" d="M160 310 Q160 200 160 95"/>
      <path class="stem" pathLength="1" d="M160 310 Q130 220 95 145"/>
      <path class="stem" pathLength="1" d="M160 310 Q190 220 225 145"/>
      <path class="stem" pathLength="1" d="M160 310 Q110 260 60 215"/>
      <path class="stem" pathLength="1" d="M160 310 Q210 260 260 215"/>
      <path class="stem" pathLength="1" d="M160 310 Q145 255 125 200"/>
      <path class="stem" pathLength="1" d="M160 310 Q175 255 195 200"/>
    </g>

    <!-- leaves -->
    <g class="leaf" fill="#4f9d5d">
      <ellipse cx="110" cy="245" rx="9" ry="20" transform="rotate(-50 110 245)"/>
      <ellipse cx="210" cy="245" rx="9" ry="20" transform="rotate(50 210 245)"/>
      <ellipse cx="140" cy="175" rx="7" ry="16" transform="rotate(-25 140 175)"/>
      <ellipse cx="180" cy="175" rx="7" ry="16" transform="rotate(25 180 175)"/>
    </g>

    <!-- roses: red and white -->
    <g transform="translate(160 90) scale(1.3)"><use href="#rose" class="rose" style="color:#d81b3c;--d:.6s"/></g>
    <g transform="translate(95 145) scale(1.2)"><use href="#rose" class="rose" style="color:#fffaf5;--d:.4s"/></g>
    <g transform="translate(225 145) scale(1.2)"><use href="#rose" class="rose" style="color:#fffaf5;--d:.5s"/></g>
    <g transform="translate(60 215) scale(1.1)"><use href="#rose" class="rose" style="color:#d81b3c;--d:.2s"/></g>
    <g transform="translate(260 215) scale(1.1)"><use href="#rose" class="rose" style="color:#d81b3c;--d:.3s"/></g>
    <g transform="translate(125 200) scale(1.15)"><use href="#rose" class="rose" style="color:#d81b3c;--d:.7s"/></g>
    <g transform="translate(195 200) scale(1.15)"><use href="#rose" class="rose" style="color:#fffaf5;--d:.8s"/></g>

    <!-- front of wrapping -->
    <polygon points="80,255 160,300 160,410 128,410" fill="#f9c9d8"/>
    <polygon points="240,255 160,300 160,410 192,410" fill="#efb3c8"/>

    <!-- ribbon bow -->
    <g fill="#d81b4a">
      <ellipse cx="143" cy="338" rx="19" ry="10" transform="rotate(-15 143 338)"/>
      <ellipse cx="177" cy="338" rx="19" ry="10" transform="rotate(15 177 338)"/>
      <path d="M153 345 L140 385 L152 380 L160 348Z M167 345 L180 385 L168 380 L160 348Z"/>
      <circle cx="160" cy="341" r="8" fill="#a8123a"/>
    </g>
  </svg>

  <div class="buttons">
    <button class="primary" id="noteBtn">Read Your Note 💌</button>
    <button class="secondary" id="bloomBtn">Bloom Again ✨</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <h2>Dear Chiechie,</h2>
      <!-- EDIT YOUR MESSAGE BELOW -->
      <p>I made this little bouquet because flowers wilt, but this one will stay with you for as long as you want it.</p>
      <p>Thank you for being my favorite person. Every day with you is my favorite day.</p>
      <p>Love always,<br>Gpoy 🌹</p>
      <button id="closeBtn">Close</button>
    </div>
  </div>

<script>
  const bouquet = document.getElementById('bouquet');
  const overlay = document.getElementById('overlay');
  function bloom() {
    bouquet.classList.remove('bloom');
    void bouquet.getBoundingClientRect();
    bouquet.classList.add('bloom');
  }
  document.getElementById('bloomBtn').onclick = bloom;
  document.getElementById('noteBtn').onclick = () => overlay.classList.add('show');
  document.getElementById('closeBtn').onclick = () => overlay.classList.remove('show');
  overlay.onclick = e => { if (e.target === overlay) overlay.classList.remove('show'); };
  document.onkeydown = e => { if (e.key === 'Escape') overlay.classList.remove('show'); };
  bloom();
</script>
</body>
</html>
